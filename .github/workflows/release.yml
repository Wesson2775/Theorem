name: Build App (Windows & Android)

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install

      - name: Build Tauri App (Windows)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ''

      # 核心修复：把路径改为 **/*.exe 和 **/*.msi，这样就算它报错也能强行把文件抓下来
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: install frontend dependencies
        run: pnpm install

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      # 关闭代码压缩，并移除必须签名的强制要求
      - name: Disable Android release minification and signing
        run: |
          FILE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i '0,/isMinifyEnabled = true/s//isMinifyEnabled = false/' "$FILE"
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' "$FILE"

      - name: Build Android APKs
        run: pnpm tauri android build --apk --split-per-abi

      # 核心修复：使用 **/ 递归查找所有子目录（universal/release 或 release 都能抓到）
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
