name: Build App (Windows & Android)

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        # 注意：这里删除了 version 字段，它会自动读取 package.json 里的 packageManager 字段

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install

      - name: Build Tauri App (Windows)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ''

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install frontend dependencies
        run: pnpm install

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      # 关闭代码压缩，并移除必须签名的强制要求（这是打未签名测试包的关键）
      - name: Disable Android release minification and signing
        run: |
          FILE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i '0,/isMinifyEnabled = true/s//isMinifyEnabled = false/' "$FILE"
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' "$FILE"

      - name: Build Android APKs
        run: pnpm tauri android build --apk --split-per-abi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          # Tauri Android 构建完成后，apk 文件通常在这个目录下
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
