name: Build App (Windows & Android)

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: install frontend dependencies
        run: pnpm install --prefer-offline

      # 使用原生命令编译，跳过 tauri-action 的强制签名验证
      - name: Build Tauri App (Windows)
        run: pnpm tauri build

      # 无论上面是否报错（比如最后的 updater 签名报错），强行把安装包抓下来
      - name: Upload Windows Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: install frontend dependencies
        run: pnpm install --prefer-offline

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Disable Android release minification and signing
        run: |
          FILE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i '0,/isMinifyEnabled = true/s//isMinifyEnabled = false/' "$FILE"
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' "$FILE"

      - name: Build Android APKs
        run: pnpm tauri android build --apk --split-per-abi

      # 使用 **/*.apk 递归抓取所有架构的安装包
      - name: Upload Android Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
